name: Build and Deploy Android APK (OTA Distribution)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Release changelog notes'
        required: false
        default: 'Automated release build with latest fixes and features.'
      force_update:
        description: 'Force all users to update'
        type: boolean
        default: false

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Extract Version Info from pubspec.yaml
        id: version_info
        run: |
          if [ -d "juanderquest_app" ]; then cd juanderquest_app; fi
          FULL_VERSION=$(grep 'version:' pubspec.yaml | head -n 1 | sed 's/version: //')
          VERSION_NAME=$(echo $FULL_VERSION | cut -d'+' -f1)
          # Use GitHub run number as incremental version code for reliable OTA increments
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Building Version: $VERSION_NAME (Code: $VERSION_CODE)"

      - name: Install Flutter Dependencies
        run: |
          if [ -d "juanderquest_app" ]; then cd juanderquest_app; fi
          flutter pub get

      - name: Build Android Release APK
        run: |
          if [ -d "juanderquest_app" ]; then cd juanderquest_app; fi
          flutter build apk --release \
            --build-name="${{ steps.version_info.outputs.version_name }}" \
            --build-number=${{ steps.version_info.outputs.version_code }} \
            --dart-define=API_BASE_URL=https://jdq.zernanvash.dev/api/v1

      - name: Locate Output APK
        id: apk_locator
        run: |
          if [ -f "juanderquest_app/build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "apk_path=juanderquest_app/build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_OUTPUT
          else
            echo "apk_path=build/app/outputs/flutter-apk/app-release.apk" >> $GITHUB_OUTPUT
          fi

      - name: Generate version.json Metadata
        run: |
          mkdir -p dist
          cp "${{ steps.apk_locator.outputs.apk_path }}" dist/juanderquest-latest.apk
          cp "${{ steps.apk_locator.outputs.apk_path }}" dist/juanderquest-v${{ steps.version_info.outputs.version_name }}.apk
          
          CHANGELOG_TEXT="${{ github.event.inputs.changelog || github.event.head_commit.message || 'Latest automated release update.' }}"
          # Clean newlines from changelog for JSON safety
          SAFE_CHANGELOG=$(echo "$CHANGELOG_TEXT" | tr '\n' ' ' | sed 's/"/\\"/g')
          
          cat <<EOF > dist/version.json
          {
            "versionCode": ${{ steps.version_info.outputs.version_code }},
            "versionName": "${{ steps.version_info.outputs.version_name }}",
            "downloadUrl": "https://jdq.zernanvash.dev/downloads/juanderquest-latest.apk",
            "changelog": "$SAFE_CHANGELOG",
            "publishedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "forceUpdate": ${{ github.event.inputs.force_update || false }},
            "minSupportedVersionCode": 1
          }
          EOF
          cat dist/version.json

      - name: Upload Artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: juanderquest-android-apk
          path: |
            dist/juanderquest-latest.apk
            dist/version.json
          retention-days: 14

      - name: Deploy to Azure VM (Downloads Server)
        if: env.AZURE_SSH_HOST != '' && env.AZURE_SSH_KEY != ''
        env:
          AZURE_SSH_HOST: ${{ secrets.AZURE_SSH_HOST }}
          AZURE_SSH_USER: ${{ secrets.AZURE_SSH_USER || 'azureuser' }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_SSH_HOST }}
          username: ${{ secrets.AZURE_SSH_USER || 'azureuser' }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: 'dist/juanderquest-latest.apk,dist/juanderquest-v${{ steps.version_info.outputs.version_name }}.apk,dist/version.json'
          target: '/var/www/jdq-downloads/'
          strip_components: 1
