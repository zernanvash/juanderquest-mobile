name: Build and Publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      changelog:
        description: Release notes
        required: false
        default: Automated JuanDerQuest alpha release.
      force_update:
        description: Require this base APK before entering the app
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          full_version="$(sed -n 's/^version: //p' pubspec.yaml | head -n 1)"
          version_name="${full_version%%+*}"
          version_code="$((GITHUB_RUN_NUMBER + 100))"
          short_sha="${GITHUB_SHA:0:7}"
          tag="android-v${version_name}+${version_code}.${GITHUB_RUN_ATTEMPT}"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Prepare protected release signing
        shell: bash
        env:
          JDQ_RELEASE_KEYSTORE_BASE64: ${{ secrets.JDQ_RELEASE_KEYSTORE_BASE64 }}
          JDQ_RELEASE_STORE_PASSWORD: ${{ secrets.JDQ_RELEASE_STORE_PASSWORD }}
          JDQ_RELEASE_KEY_ALIAS: ${{ secrets.JDQ_RELEASE_KEY_ALIAS }}
          JDQ_RELEASE_KEY_PASSWORD: ${{ secrets.JDQ_RELEASE_KEY_PASSWORD }}
          JDQ_RELEASE_CERT_SHA256: ${{ vars.JDQ_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in JDQ_RELEASE_KEYSTORE_BASE64 JDQ_RELEASE_STORE_PASSWORD JDQ_RELEASE_KEY_ALIAS JDQ_RELEASE_KEY_PASSWORD JDQ_RELEASE_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing protected release signing setting: $name" >&2
              exit 1
            fi
          done
          signing_path="$RUNNER_TEMP/jdq-release.jks"
          umask 077
          printf '%s' "$JDQ_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$signing_path"
          actual_cert="$(keytool -list -v -keystore "$signing_path" -alias "$JDQ_RELEASE_KEY_ALIAS" -storepass:env JDQ_RELEASE_STORE_PASSWORD | sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | awk 'NR == 1 { print }')"
          expected_cert="$(printf '%s' "$JDQ_RELEASE_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$actual_cert" =~ ^[a-f0-9]{64}$ || "$actual_cert" != "$expected_cert" ]]; then
            echo 'Release signing certificate does not match JDQ_RELEASE_CERT_SHA256.' >&2
            exit 1
          fi
          echo "JDQ_RELEASE_KEYSTORE_PATH=$signing_path" >> "$GITHUB_ENV"
          echo "Release signing certificate SHA-256: $actual_cert" >> "$GITHUB_STEP_SUMMARY"
      - name: Build signed release APK
        env:
          JDQ_RELEASE_STORE_PASSWORD: ${{ secrets.JDQ_RELEASE_STORE_PASSWORD }}
          JDQ_RELEASE_KEY_ALIAS: ${{ secrets.JDQ_RELEASE_KEY_ALIAS }}
          JDQ_RELEASE_KEY_PASSWORD: ${{ secrets.JDQ_RELEASE_KEY_PASSWORD }}
        run: >-
          flutter build apk --release
          --build-name="${{ steps.release.outputs.version_name }}"
          --build-number="${{ steps.release.outputs.version_code }}"
          --dart-define=UPDATE_MANIFEST_URL=https://github.com/${{ github.repository }}/releases/latest/download/version.json
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.juanderquest.app/api/v1' }}
      - name: Create release assets and manifest
        env:
          CHANGELOG_INPUT: ${{ inputs.changelog }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          FORCE_UPDATE: ${{ inputs.force_update || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          apk_source="build/app/outputs/flutter-apk/app-release.apk"
          apk_name="juanderquest-${{ steps.release.outputs.tag }}.apk"
          cp "$apk_source" "dist/$apk_name"
          cp "$apk_source" dist/juanderquest-latest.apk
          sha256="$(sha256sum "$apk_source" | cut -d' ' -f1)"
          size_bytes="$(stat -c '%s' "$apk_source")"
          notes="${CHANGELOG_INPUT:-${COMMIT_MESSAGE:-Automated JuanDerQuest alpha release.}}"
          notes="${notes}"$'\n\n'"Signing generation 2: installations signed with the legacy alpha key require a one-time uninstall/reinstall. Once installed, generation-2 releases update in place. Back up any unsynced local data before uninstalling."
          jq -n \
            --argjson versionCode '${{ steps.release.outputs.version_code }}' \
            --arg versionName '${{ steps.release.outputs.version_name }}' \
            --arg commitHash '${{ steps.release.outputs.short_sha }}' \
            --arg fileName "$apk_name" \
            --arg downloadUrl 'https://github.com/${{ github.repository }}/releases/latest/download/juanderquest-latest.apk' \
            --arg sha256 "$sha256" \
            --argjson sizeBytes "$size_bytes" \
            --arg changelog "$notes" \
            --arg publishedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --argjson forceUpdate "$FORCE_UPDATE" \
            '{schemaVersion: 1, packageName: "dev.zernanvash.juanderquest", signingKeyGeneration: 2, legacyInstallRequiresReinstall: true, versionCode: $versionCode, versionName: $versionName, commitHash: $commitHash, fileName: $fileName, downloadUrl: $downloadUrl, sha256: $sha256, sizeBytes: $sizeBytes, changelog: $changelog, publishedAt: $publishedAt, forceUpdate: $forceUpdate, minSupportedVersionCode: (if $forceUpdate then $versionCode else 1 end), minimumBaseVersionCode: (if $forceUpdate then $versionCode else 1 end), baseReleaseRequired: $forceUpdate, updatePolicy: (if $forceUpdate then "mandatory" else "optional" end)}' \
            > dist/version.json
          sha256sum dist/juanderquest-latest.apk "dist/$apk_name" dist/version.json > dist/SHA256SUMS
          jq -e '.schemaVersion == 1 and .versionCode > 0 and (.sha256 | test("^[a-f0-9]{64}$")) and .sizeBytes > 5000000' dist/version.json
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: juanderquest-android-${{ steps.release.outputs.version_code }}
          path: dist/
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create '${{ steps.release.outputs.tag }}' \
            dist/juanderquest-latest.apk \
            'dist/juanderquest-${{ steps.release.outputs.tag }}.apk' \
            dist/version.json \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title 'JuanDerQuest Android ${{ steps.release.outputs.version_name }} (${{ steps.release.outputs.version_code }})' \
            --notes-file <(jq -r '.changelog' dist/version.json) \
            --draft
          gh release edit '${{ steps.release.outputs.tag }}' --draft=false \
            --latest
